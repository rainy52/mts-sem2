spring:
  application:
    name: task-manager-mvp
  profiles:
    default: dev
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081

api:
  version: 2.0.0

app:
  name: Task Manager MVP
  version: 1.0.0
  environment: base
  debug-mode: false
  load-default-tasks: true
  attachments:
    upload-dir: uploads

logging:
  level:
    root: INFO
    com.mipt.mvpmts2: INFO
  file:
    name: logs/task-manager.log
